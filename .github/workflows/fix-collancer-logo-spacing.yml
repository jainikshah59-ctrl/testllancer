name: Fix Collancer logo spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix both Collancer logo icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = "objectFit: 'cover', borderRadius: 12"
          new = "objectFit: 'contain', padding: 5, background: 'rgba(255,255,255,0.04)', borderRadius: 12"
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least 2 logo icon instances, found {count}')
          s = s.replace(old, new)
          p.write_text(s)
          print(f'Updated {count} Collancer logo icon instances')
          PY

      - name: Commit logo fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-collancer-logo-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/fix-collancer-logo-spacing.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Collancer logo icon spacing'
          git push origin HEAD:main
