<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collancer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
      import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

      const firebaseConfig = {
        projectId: "collancer-8fd62",
        authDomain: "collancer-8fd62.firebaseapp.com",
        storageBucket: "collancer-8fd62.firebasestorage.app",
        messagingSenderId: "154521281878",
        appId: "1:154521281878:web:ae6439817888eedd6ce2f7"
      };

      const app = initializeApp(firebaseConfig);
      
      const db = initializeFirestore(app, {
        localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}),
        experimentalAutoDetectLongPolling: true
      });
      
      const auth = getAuth(app);

      window.__cdb = db;
      window.__cauth = auth;
      window.__cfs = { getFirestore };
      window.__cauthOps = { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut };

      window.__db = db;
      window.__auth = auth;
      window.__fsOps = { getFirestore };
      window.__authOps = { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
